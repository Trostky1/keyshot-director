name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-and-image-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run isolated agent, photo, staging, image and material workflow checks
        run: node --test tools/test_agent_lighting_fallback.js tools/test_agent_material_graph_reference.js tools/test_photo.js tools/test_photo_refinement.js tools/test_lighting_measurements.js tools/test_style_measurements.js tools/test_package_contract.js tools/test_startup.js tools/test_staging_cli.js tools/test_image_tools.js tools/test_material_textures.js tools/test_material_core.js tools/test_texture_edit.js tools/test_cli_command_length.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check material edit recovery with an isolated KeyShot substitute
        run: |
          python tools/test_material_receipts.py
          python tools/test_lighting_camera.py
          python tools/test_material_create.py
          python tools/test_material_color_build.py
