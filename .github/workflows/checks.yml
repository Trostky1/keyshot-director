name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-and-image-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run isolated lighting, framing, staging and image-tool checks
        run: node --test tools/test_photo.js tools/test_staging_cli.js tools/test_image_tools.js
