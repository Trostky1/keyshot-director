<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1880" viewBox="0 0 390 1880" role="img" aria-labelledby="title desc">
  <title id="title">KeyShot Director current mobile UI reference</title>
  <desc id="desc">Editable vector approximation of the current mobile screen showing the single-column order: Studio, Match a look, Ask Director, and tools.</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#1d1d1f}.muted{fill:#65656b}.tiny{font-size:10px}.small{font-size:12px}.h1{font-size:23px;font-weight:700}.h2{font-size:16px;font-weight:650}.line{stroke:#dedee3;stroke-width:1}.surface{fill:#fff;stroke:#dedee3;stroke-width:1}.button{fill:#fff;stroke:#d6d6dc}.blue{fill:#0066cc}.blueText{fill:#fff}.stage{fill:#fbfbfc;stroke:#d5d5da}.dash{fill:#f8fafd;stroke:#9da8b6;stroke-dasharray:5 4}</style>
  <rect width="390" height="1880" fill="#f5f5f7"/><rect width="390" height="56" fill="#fff"/><line x1="0" y1="55" x2="390" y2="55" class="line"/><circle cx="16" cy="18" r="4" fill="#38a169"/><text x="27" y="22" class="small" font-weight="700">KeyShot Director</text><rect x="303" y="8" width="70" height="32" rx="8" class="button"/><text x="318" y="28" class="tiny">Settings</text><text x="17" y="45" class="tiny muted">KeyShot connected</text>
  <text x="17" y="86" class="h1">Studio</text><text x="17" y="104" class="tiny muted">Shape your product in KeyShot, right from here.</text><rect x="17" y="115" width="356" height="267" rx="16" class="stage"/><rect x="105" y="124" width="184" height="36" rx="10" class="surface"/><rect x="116" y="135" width="13" height="13" rx="3" class="button"/><text x="135" y="146" class="tiny">live preview</text><text x="237" y="146" class="tiny">Refresh</text><g transform="translate(146 165) rotate(13)"><rect width="85" height="170" rx="12" fill="#292827"/><rect x="8" y="18" width="69" height="123" rx="5" fill="#141414"/><rect x="13" y="148" width="58" height="16" rx="4" fill="#aba19a"/></g><rect x="25" y="345" width="300" height="25" rx="7" fill="#2d2d31"/><text x="32" y="361" class="tiny blueText">drag orbit · right-drag / shift-drag pan</text>
  <rect x="17" y="399" width="356" height="338" rx="16" class="surface"/><text x="33" y="429" class="h2">Match a look</text><text x="33" y="447" class="tiny muted">Bring the lighting and mood of a photo to your own product.</text><rect x="33" y="458" width="120" height="20" rx="10" fill="#edf7f0"/><text x="42" y="472" class="tiny">Ready for a reference</text><rect x="33" y="490" width="324" height="72" rx="10" class="dash"/><text x="119" y="522" class="small" fill="#245c94">Add a reference photo</text><text x="104" y="540" class="tiny muted">Choose or drop · PNG, JPG, WebP</text><text x="33" y="587" class="tiny" font-weight="600">What should we borrow?</text><rect x="33" y="596" width="324" height="58" rx="7" class="button"/><text x="42" y="620" class="tiny muted">Soft side light, crisp edge reflections,</text><text x="42" y="637" class="tiny muted">a warm background...</text><rect x="33" y="670" width="14" height="14" rx="3" class="button"/><text x="54" y="681" class="tiny muted">Match framing too</text><rect x="33" y="699" width="324" height="34" rx="8" class="blue"/><text x="149" y="721" class="tiny blueText">Match this look</text>
  <text x="17" y="773" class="h2">Ask Director</text><text x="17" y="791" class="tiny muted">Lighting, framing, scene layout, and motion</text><rect x="17" y="803" width="356" height="54" rx="14" class="surface"/><text x="31" y="835" class="tiny muted">Your conversation will appear here.</text><rect x="17" y="857" width="356" height="147" rx="0 0 14 14" class="surface"/><rect x="31" y="872" width="328" height="55" rx="7" fill="#fcfcfd" stroke="#d8d8df"/><text x="41" y="899" class="tiny muted">Describe a look, ask for a close-up, or arrange</text><text x="41" y="914" class="tiny muted">your product...</text><rect x="31" y="940" width="39" height="32" rx="8" class="blue"/><text x="42" y="960" class="tiny blueText">Send</text><rect x="76" y="940" width="42" height="32" rx="8" class="button"/><text x="87" y="960" class="tiny muted">Stop</text><rect x="124" y="940" width="94" height="32" rx="8" class="button"/><text x="136" y="960" class="tiny">Attach images</text><rect x="224" y="940" width="76" height="32" rx="8" class="button"/><text x="235" y="960" class="tiny">New chat</text>
  <rect x="17" y="1028" width="356" height="148" rx="16" class="surface"/><text x="33" y="1057" class="h2">Frame &amp; background</text><text x="33" y="1076" class="tiny muted">Choose what fills your frame.</text><rect x="33" y="1090" width="93" height="32" rx="8" class="button"/><text x="47" y="1110" class="tiny">Full product</text><rect x="132" y="1090" width="98" height="32" rx="8" class="button"/><text x="143" y="1110" class="tiny">Detail close-up</text><rect x="236" y="1090" width="99" height="32" rx="8" class="button"/><text x="247" y="1110" class="tiny">Upper detail</text><rect x="33" y="1135" width="324" height="32" rx="8" class="button"/><text x="43" y="1155" class="tiny">Landscape · 16:9</text>
  <g transform="translate(17 1194)"><rect width="356" height="52" rx="16" class="surface"/><text x="16" y="31" class="small" font-weight="600">Connect KeyShot</text><text x="331" y="32" class="small muted">⌄</text></g><g transform="translate(17 1256)"><rect width="356" height="52" rx="16" class="surface"/><text x="16" y="31" class="small" font-weight="600">Reference video &amp; animation</text><text x="331" y="32" class="small muted">⌄</text></g>
  <text x="17" y="1354" class="h2">Studio lighting</text><text x="17" y="1372" class="tiny muted">Pick a rig. Everything it adds is removed by Studio off.</text><rect x="17" y="1384" width="109" height="32" rx="8" class="button"/><text x="32" y="1404" class="tiny">Hero soft (3-point)</text><rect x="132" y="1384" width="101" height="32" rx="8" class="button"/><text x="151" y="1404" class="tiny">Dark &amp; moody</text><rect x="239" y="1384" width="97" height="32" rx="8" class="button"/><text x="253" y="1404" class="tiny">Warm luxe</text><rect x="17" y="1432" width="356" height="170" rx="14" fill="#fafafd" stroke="#dedee3"/><circle cx="195" cy="1517" r="63" fill="none" stroke="#dedee3"/><circle cx="195" cy="1517" r="37" fill="none" stroke="#dedee3"/><rect x="190" y="1512" width="10" height="10" fill="#8a8a92"/><line x1="195" y1="1517" x2="158" y2="1544" stroke="#1d1d1f" stroke-width="3"/><text x="176" y="1567" class="tiny muted">KeyShot</text><text x="30" y="1624" class="tiny muted">key_unknown     Remove</text><text x="30" y="1651" class="tiny muted">overhead         Remove</text><text x="30" y="1678" class="tiny muted">fill                  Remove</text><text x="17" y="1724" class="h2">Styles</text><text x="17" y="1742" class="tiny muted">Each folder in references/ is a style.</text><rect x="17" y="1754" width="356" height="50" rx="10" class="surface"/><text x="33" y="1784" class="small">closeups · 0 images</text><rect x="17" y="1815" width="356" height="50" rx="10" class="surface"/><text x="33" y="1845" class="small">commerce · 17 images</text>
</svg>
